spring.application.name=notification-svc
server.port=8081

# Database configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/notification_service?createDatabaseIfNotExist=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.username=root
spring.datasource.password=Test1234
logging.level.org.hibernate.persister.entity=ERROR

# Email Sender configuration

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lightthedeal@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.ssl.enable=true

notification.service.api-key=${X_API_KEY}

logging.level.org.springframework.security=DEBUG
